spring:
  application:
    name: video-processing-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:fiapx}
    username: ${RABBITMQ_USER:fiapx}
    password: ${RABBITMQ_PASSWORD:fiapx123}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      path: ${STORAGE_LOCAL_PATH:/app/videos/uploads}
      output-path: ${STORAGE_OUTPUT_PATH:/app/videos/processed}
  processing:
    ffmpeg:
      timeout-minutes: ${FFMPEG_TIMEOUT_MINUTES:10}
    jobs:
      max-history: ${JOBS_MAX_HISTORY:100}

logging:
  level:
    br.com.fiap: INFO
    org.springframework: WARN

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8090}

swagger:
  server:
    url: ${SWAGGER_SERVER_URL:/}

---
spring:
  config:
    activate:
      on-profile: test
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

app:
  storage:
    type: local
    local:
      path: ./target/test-storage
      output-path: ./target/test-outputs

---
spring:
  config:
    activate:
      on-profile: docker
  rabbitmq:
    host: ${RABBITMQ_HOST:fiap-rabbitmq}

---
spring:
  config:
    activate:
      on-profile: local

app:
  storage:
    type: local
    local:
      # Caminho relativo ao projeto de upload — funciona em qualquer máquina
      # desde que os dois projetos estejam na mesma pasta pai.
      path: ../fiap-14soat-tc-fase5-video-upload-service/uploads
      output-path: ../fiap-14soat-tc-fase5-video-upload-service/processed

---
spring:
  config:
    activate:
      on-profile: k8s

# O ingress reescreve /processing(/|$)(.*) -> /$2, entao o app recebe as
# requisicoes sem o prefixo /processing. O Swagger UI roda no browser e
# precisa dos paths completos (com prefixo) para que o ingress roteie
# corretamente as chamadas de api-docs/config feitas pelo JS da pagina.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    config-url: /processing/v3/api-docs/swagger-config
    url: /processing/v3/api-docs

